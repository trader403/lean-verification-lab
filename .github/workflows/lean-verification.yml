
name: Lean verification

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: lean-verification-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Preflight and Lean build
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Run source preflight
        run: |
          python "${PROJECT_DIR}/scripts/audit_lean.py" --root "${PROJECT_DIR}" --report preflight-report.json
        env:
          PROJECT_DIR: lean-verification-starter-v0.2
          
      - name: Generate Lake manifest
        working-directory: lean-verification-starter-v0.2
        run: |
          curl https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -sSf | sh -s -- -y --default-toolchain none --no-modify-path
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
          export PATH="$HOME/.elan/bin:$PATH"
          lake update

      - name: Install Lean and build project
        uses: leanprover/lean-action@v1
        with:
          lake-package-directory: lean-verification-starter-v0.2
          auto-config: false
          build: true
          use-mathlib-cache: false

      - name: Upload preflight evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lean-verification-preflight
          path: preflight-report.json
          if-no-files-found: warn
